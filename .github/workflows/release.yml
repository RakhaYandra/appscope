name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: sanity tests
        run: go test ./...
      - name: build linux/amd64
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CGO_ENABLED=1 go build -trimpath \
            -ldflags="-s -w -X github.com/RakhaYandra/appscope/internal/cli.Version=${TAG}" \
            -o appscope-linux-amd64 ./cmd/appscope
          sha256sum appscope-linux-amd64 > appscope-linux-amd64.sha256
      - name: smoke test binary
        run: |
          ./appscope-linux-amd64 --version
          ./appscope-linux-amd64 --help >/dev/null
      - name: publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            appscope-linux-amd64
            appscope-linux-amd64.sha256
